AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.3
  Exclude:
    - 'vendor/**/*'
    - 'db/**/*'
    - 'data/**/*'
    - 'reports/**/*'
    - 'logs/**/*'

# ---------------------------------------------------------------------------
# Layout
# ---------------------------------------------------------------------------

Layout/HashAlignment:
  Enabled: false

Layout/ExtraSpacing:
  AllowForAlignment: true

Layout/LineLength:
  Max: 120
  AllowHeredoc: true
  AllowURI: true
  Exclude:
    - 'bin/**/*'
    - 'Gemfile'

# ---------------------------------------------------------------------------
# Metrics — relajados para scripts y specs de laboratorio
# ---------------------------------------------------------------------------

Metrics/MethodLength:
  Max: 40
  Exclude:
    - 'bin/**/*'
    - 'spec/**/*'

Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'spec/**/*'
    - 'bin/**/*'

Metrics/AbcSize:
  Max: 35
  Exclude:
    - 'bin/**/*'

Metrics/ParameterLists:
  Max: 6
  Exclude:
    - 'bin/**/*'
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 200

Metrics/ModuleLength:
  Max: 200

# ---------------------------------------------------------------------------
# Style
# ---------------------------------------------------------------------------

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Style/FormatString:
  EnforcedStyle: percent

Style/FormatStringToken:
  EnforcedStyle: template

Style/WordArray:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------

Lint/ConstantDefinitionInBlock:
  Enabled: false

# ---------------------------------------------------------------------------
# Bundler
# ---------------------------------------------------------------------------

Bundler/OrderedGems:
  Enabled: false

# ---------------------------------------------------------------------------
# Naming
# ---------------------------------------------------------------------------

Naming/MethodParameterName:
  MinNameLength: 1

Naming/PredicateMethod:
  Enabled: false

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------

Lint/UnmodifiedReduceAccumulator:
  Enabled: false

# ---------------------------------------------------------------------------
# Style adicional
# ---------------------------------------------------------------------------

Style/ComparableClamp:
  Enabled: false
